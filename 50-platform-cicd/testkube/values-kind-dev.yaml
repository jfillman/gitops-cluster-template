# Which onboarded tenants' <type>-<appName>-cicd namespaces Testkube is allowed to run
# TestWorkflows in. Starts empty - a freshly bootstrapped cluster has no tenants yet.
# Hand-maintained as part of the same reviewed PR that adds tenants/<app-name>/
# identity.yaml (see platform-cicd's docs/admin/onboarding-mechanics.md step 3) - not
# automated, because Testkube enforces this list as a hard runtime allow-list in code
# with no wildcard option (see application.yaml's header), and onboarding a tenant
# already requires a reviewed PR anyway, so this is one more field in an existing
# motion, not a new category of toil.
#
# generateAPIServerRBAC/generateTestJobRBAC do NOT default to true when omitted -
# verified live via `helm template`: the chart's `{{- if $rangeItem.generateAPIServerRBAC }}`
# guards are falsy on a missing key, so leaving these out silently renders zero Role/
# RoleBinding objects for that namespace (Testkube would pass its own namespace allow-
# list check, then fail with a K8s RBAC 403 trying to actually create the Job).
#
# jobServiceAccountName also has no default - the chart templates
# `metadata: name: {{ $rangeItem.jobServiceAccountName }}` verbatim on the
# ServiceAccount it creates for that namespace, so an omitted value renders a
# ServiceAccount with an empty metadata.name (rejected by the API server outright).
#
# When adding a tenant entry, set all four fields explicitly:
#   executionNamespaces:
#     - namespace: app-some-app-cicd
#       generateAPIServerRBAC: true
#       generateTestJobRBAC: true
#       jobServiceAccountName: tests-job-app-some-app-cicd   # convention: tests-job-<namespace>
testkube-api:
  additionalNamespaces: []
  executionNamespaces: []
