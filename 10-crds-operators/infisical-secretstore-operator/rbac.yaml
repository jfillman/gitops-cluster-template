# Scoped to exactly what main.py's reconcile loop needs - InfisicalProject CRs
# (any namespace: the SecretStore XRD's Composition can create one in any tenant
# app namespace) and Secrets (cluster-wide write, same precedent as ESO's own
# installed ClusterRole granting get/list/watch/create/update/patch/delete on
# Secrets with no namespace restriction - confirmed live in
# platform-cicd-control-plane's cluster-secret-store.yaml header). No `events`
# RBAC - kopf's own progress-Event posting is disabled in main.py's startup
# handler instead of granting that cluster-wide for a first pass.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: infisical-secretstore-operator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: infisical-secretstore-operator
rules:
  - apiGroups: ["secrets.idp.io"]
    resources: ["infisicalprojects", "infisicalenvironments"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: ["secrets.idp.io"]
    resources: ["infisicalprojects/status", "infisicalenvironments/status"]
    verbs: ["get", "patch", "update"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # kopf's own low-volume bookkeeping (last-handled-configuration annotation etc.)
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["list", "watch"]
  # kopf introspects the CRD object itself at startup (schema/served-versions
  # discovery for infisicalprojects.secrets.idp.io) - confirmed live, missing this
  # produced a real, immediate startup error (APIForbiddenError, retried 9x then
  # gave up). Read-only, cluster-scoped by necessity (CRDs aren't namespaced).
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: infisical-secretstore-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: infisical-secretstore-operator
subjects:
  - kind: ServiceAccount
    name: infisical-secretstore-operator
    namespace: infisical
