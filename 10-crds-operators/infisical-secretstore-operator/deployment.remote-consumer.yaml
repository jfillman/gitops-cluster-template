# This is the infisicalHost: false variant (this cluster does NOT run its own
# Infisical instance - it's a remote consumer of whichever cluster does). See
# deployment.yaml in this same directory for the infisicalHost: true variant.
# hack/customize-cluster.sh keeps exactly one of the two, renaming whichever
# survives to deployment.yaml - same swap pattern as 20-service-catalog/
# idp-service-catalog/application.yaml's full/attached-tier-only split.
#
# No INFISICAL_K8S_CA_CERT/INFISICAL_K8S_TOKEN_REVIEWER_JWT/ESO_SERVICEACCOUNT_* -
# this cluster's InfisicalProject CRs always get authMethod: universal (SecretStore
# Composition's own cluster-based branch), never kubernetes -
# configure_kubernetes_auth() is simply never called on a remote-consumer cluster.
# See idp-service-catalog/operators/infisical-secretstore-operator/README.md's "Two
# auth methods" section for the full design, and its "Real bug found and fixed
# 2026-08-26" note for what happens if these 4 vars end up on a remote-consumer
# cluster by mistake (CreateContainerConfigError on a Secret,
# infisical-token-reviewer-token, that legitimately doesn't exist here).
#
# INFISICAL_API_URL / INFISICAL_ORG_ID below are copied from the fleet's real,
# live-verified values (kind-prod's and kind-man's own copies of this file, both
# confirmed working) - NOT substituted per-cluster by customize-cluster.sh, because
# every remote-consumer cluster in this fleet talks to the SAME one Infisical
# instance (idp/docs/service-catalog-design.md Item 8: Infisical is shared platform
# infra, installed once, on kind-dev only) and shares the same org. INFISICAL_API_URL
# uses the dev.kiac.local hostname (updated 2026-09-04, was a raw podman-network IP
# that's non-monotonic and drifts across kind-dev restarts/rebuilds - stale from day
# one for any cluster provisioned off this template, and confirmed live-broken on
# kind-prod/kind-man before the hostAliases block below was added). CoreDNS can't
# resolve that hostname on its own though (never consults the Mac host's
# /etc/hosts) - hence hostAliases. Verify the IP is still correct against the live
# cluster before/after bootstrapping a new remote-consumer cluster - don't assume
# this committed value is current; refresh-kiac-hosts.sh heals it going forward. A
# real routable endpoint (VPN/peering/ingress) between genuinely separate clusters
# wouldn't have this problem; see infisical-nodeport.yaml's own header.
#
# INFISICAL_ADMIN_TOKEN: copied from kind-dev's own infisical-bootstrap-secret via a
# direct kubectl-to-kubectl pipe once this cluster exists, value never
# displayed/pasted anywhere - same "never paste credentials" discipline as
# everywhere else in this project. A real, deliberate expansion of that token's
# blast radius per remote-consumer cluster added - an accepted, flagged cost of "one
# shared Infisical instance" (over a per-cluster Infisical instance).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: infisical-secretstore-operator
  namespace: infisical
  labels:
    app: infisical-secretstore-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: infisical-secretstore-operator
  template:
    metadata:
      labels:
        app: infisical-secretstore-operator
    spec:
      serviceAccountName: infisical-secretstore-operator
      hostAliases:
        - ip: "192.168.64.11"
          hostnames:
            - "dev.kiac.local"
      containers:
        - name: operator
          image: ghcr.io/jfillman/infisical-secretstore-operator:dev
          imagePullPolicy: IfNotPresent
          env:
            - name: USER
              value: infisical-secretstore-operator
            - name: INFISICAL_API_URL
              value: http://dev.kiac.local:31800
            - name: INFISICAL_ORG_ID
              value: "9144c116-d1eb-4cea-bac9-9b5272035ea7"
            - name: INFISICAL_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: infisical-bootstrap-secret
                  key: token
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1001
            capabilities:
              drop: ["ALL"]
