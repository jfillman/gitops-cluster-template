# kind clusters have no LoadBalancer implementation (no MetalLB, no cloud
# controller-manager) and neither kind-config.yaml configures extraPortMappings, so
# envoy's vendored Service (type: LoadBalancer) sits permanently <pending> - no real
# ingress path into the cluster exists at all, and ArgoCD's built-in Service health
# check reports the contour Application stuck "Progressing" forever as a result
# (confirmed live on kind-dev/kind-prod 2026-08-23).
#
# Patched here rather than hand-edited into install.yaml (see that file's own "do not
# edit directly" header - it's vendored, unmodified, straight from upstream Contour)
# to keep this cluster-specific divergence isolated and diffable. Switches envoy to
# NodePort with fixed ports 30080/30443 so hack/kind-config.yaml's extraPortMappings
# can forward host 80/443 to something deterministic - the node picks a random
# ephemeral nodePort otherwise, which would silently drift out of sync with whatever
# is hardcoded in kind-config.yaml on the next cluster recreate.
resources:
  - install.yaml

patches:
  - target:
      kind: Service
      name: envoy
    patch: |-
      - op: replace
        path: /spec/type
        value: NodePort
      - op: add
        path: /spec/ports/0/nodePort
        value: 30080
      - op: add
        path: /spec/ports/1/nodePort
        value: 30443
